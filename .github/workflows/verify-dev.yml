name: Verify development branch

on:
  push:
    branches: [dev, feat/updater-dev-channel]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: nvaccess/nvda
          path: .nvda-master
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'configobj==5.0.9'
      - name: Full verification
        env:
          CLASSICSPEECH_NVDA_MASTER: ${{ github.workspace }}/.nvda-master
        run: python scripts/verify.py
      - name: Package unchannelled verification artifact (not a release)
        env:
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$(python -c 'from scripts.package_addon import build_version; from datetime import datetime, timezone; import os; print(build_version(datetime.now(timezone.utc).strftime("%Y-%m-%d"), os.environ["RUN_NUMBER"]))')"
          python scripts/package_addon.py --version "$version" --commit "$COMMIT" --label "g${COMMIT:0:7}"
          mkdir -p verified-artifact
          cp "dist/ClassicSpeech-$version-g${COMMIT:0:7}.nvda-addon"* verified-artifact/
      - uses: actions/upload-artifact@v7
        with:
          name: verified-${{ github.sha }}
          path: verified-artifact/*
          if-no-files-found: error
          retention-days: 30
