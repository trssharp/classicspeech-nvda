name: Verify and package ClassicSpeech

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional numeric release version (for example, 4.0.0). Leave blank for a date/run build."
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out ClassicSpeech
        uses: actions/checkout@v7

      - name: Check out NVDA source for compatibility harnesses
        uses: actions/checkout@v7
        with:
          repository: nvaccess/nvda
          path: .nvda-master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run ClassicSpeech harnesses
        env:
          CLASSICSPEECH_NVDA_MASTER: ${{ github.workspace }}/.nvda-master
        run: |
          python -m py_compile classicSpeech.py tests/*.py
          for test in tests/*harness.py; do
            python "$test"
          done

      - name: Build manifest-versioned NVDA add-on
        id: package
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            version="$RELEASE_VERSION"
            label=""
          else
            build_date="$(date -u +%F)"
            version="$(BUILD_DATE="$build_date" python -c 'from scripts.package_addon import build_version; import os; print(build_version(os.environ["BUILD_DATE"], os.environ["RUN_NUMBER"]))')"
            label="g${COMMIT_SHA:0:7}"
          fi
          package_output="$(python scripts/package_addon.py --version "$version" --label "$label")"
          package_name="$(printf '%s\n' "$package_output" | awk -F= '/^PACKAGE_NAME=/{print $2}')"
          test -n "$package_name"
          echo "$package_output"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Upload manifest-versioned add-on artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            dist/${{ steps.package.outputs.package_name }}
            dist/${{ steps.package.outputs.package_name }}.sha256
          if-no-files-found: error
          retention-days: 30
