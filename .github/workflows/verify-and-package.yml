name: Verify and package ClassicSpeech

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out ClassicSpeech
        uses: actions/checkout@v7

      - name: Check out NVDA source for compatibility harnesses
        uses: actions/checkout@v7
        with:
          repository: nvaccess/nvda
          path: .nvda-master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run ClassicSpeech harnesses
        env:
          CLASSICSPEECH_NVDA_MASTER: ${{ github.workspace }}/.nvda-master
        run: |
          python -m py_compile classicSpeech.py tests/*.py
          for test in tests/*harness.py; do
            python "$test"
          done

      - name: Build manifest-versioned NVDA add-on
        id: package
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          build_date="$(date -u +%F)"
          package_output="$(python scripts/package_addon.py --date "$build_date")"
          version="$(printf '%s\n' "$package_output" | awk -F= '/^PACKAGE_VERSION=/{print $2}')"
          test -n "$version"
          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              "v$version") label="" ;;
              "v$version-rc."[0-9]*) label="${REF_NAME#v$version-}" ;;
              *) echo "Tag $REF_NAME must be v$version or v$version-rc.N" >&2; exit 1 ;;
            esac
          else
            label="dev.$RUN_NUMBER-g${COMMIT_SHA:0:7}"
          fi
          package_output="$(python scripts/package_addon.py --date "$build_date" --label "$label")"
          package_name="$(printf '%s\n' "$package_output" | awk -F= '/^PACKAGE_NAME=/{print $2}')"
          test -n "$package_name"
          echo "$package_output"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Upload manifest-versioned add-on artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            dist/${{ steps.package.outputs.package_name }}
            dist/${{ steps.package.outputs.package_name }}.sha256
          if-no-files-found: error
          retention-days: 30
